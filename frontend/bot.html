<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bot · Twap Hunter</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">TWAP<span>HUNTER</span></div>
    <nav id="page-nav">
      <a href="/" class="nav-link">TERMINAL</a>
      <a href="/bots" class="nav-link">◀ BOTS</a>
      <a href="/real" class="nav-link">REAL</a>
    </nav>
    <div class="bot-title">
      <span class="bc-status" id="bd-status"></span>
      <span class="bc-name" id="bd-name">…</span>
      <span class="bc-asset" id="bd-asset"></span>
      <span class="bc-strategy" id="bd-strategy"></span>
    </div>
    <div class="topbar-right">
      <span class="bd-equity"><span class="muted">Equity</span> <b id="bd-equity">—</b>
        <b id="bd-pnl" class="flat">—</b></span>
      <div class="lot-ctrl" id="bd-lot" title="Lot size — choose fixed $ or % of capital">
        <span class="lot-label">LOT</span>
        <select class="lot-type" id="bd-lot-type">
          <option value="usd" selected>USD</option>
          <option value="pct">% capital</option>
        </select>
        <input class="lot-input" id="bd-lot-input" type="number" step="0.01" min="0" value="1" />
        <button type="button" class="lot-apply" id="bd-lot-apply">Apply</button>
      </div>
      <button id="bd-toggle" class="primary-btn">…</button>
    </div>
  </header>

  <main id="bot-main">
    <div class="bd-grid">

      <div class="chart-card" id="bd-twap-card">
        <div class="chart-head">
          <span class="chart-title">ORACLE / TWAP <span class="muted" id="bd-round"></span></span>
          <span class="legend">
            <i class="sw sw-chainlink"></i>Chainlink
            <i class="sw sw-twap"></i>TWAP
            <i class="sw sw-ptb"></i>Price to beat
            <i class="sw sw-pred"></i>Prediction
          </span>
        </div>
        <canvas id="chart-twap"></canvas>
      </div>

      <div class="card" id="bd-brain-card">
        <div class="card-title">BOT BRAIN <span class="muted">(live)</span></div>
        <div class="brain-summary" id="bd-brain-summary">—</div>
        <div id="bd-brain-conditions"></div>
        <div class="card-title" style="margin-top:12px">POSITION</div>
        <div id="bd-position" class="bd-position">flat</div>
        <div id="bd-portfolio-wrap" style="display:none">
          <div class="card-title" style="margin-top:12px">COPIED PORTFOLIO</div>
          <div id="bd-portfolio"></div>
        </div>
        <div class="card-title" style="margin-top:12px">STATS</div>
        <div class="kv"><span>Record</span><b id="bd-record">—</b></div>
        <div class="kv"><span>Rounds settled</span><b id="bd-rounds">—</b></div>
        <div class="kv"><span>Fees paid</span><b id="bd-fees">—</b></div>
        <div class="kv"><span>Balance (cash)</span><b id="bd-balance">—</b></div>
      </div>

      <div class="chart-card" id="bd-quote-card">
        <div class="chart-head">
          <span class="chart-title">UP QUOTE + BOT TRADES (¢)</span>
          <span class="legend"><i class="sw sw-bid"></i>Bid <i class="sw sw-ask"></i>Ask
            <span class="muted">▲ buy · ▼ exit</span></span>
        </div>
        <canvas id="chart-quotes"></canvas>
      </div>

      <div class="chart-card" id="bd-equity-card">
        <div class="chart-head">
          <span class="chart-title">EQUITY CURVE</span>
          <span class="legend muted" id="bd-equity-info"></span>
        </div>
        <canvas id="chart-equity"></canvas>
      </div>

      <div class="card" id="bd-params-card">
        <div class="card-title">PARAMETERS</div>
        <div id="bd-params"></div>
      </div>

      <div class="card" id="bd-trades-card">
        <div class="card-title">TRADE LOG</div>
        <div class="bd-trades-scroll"><table class="trades-table"><tbody id="bd-trades"></tbody></table></div>
      </div>

    </div>
  </main>
</div>

<script type="module" src="/js/bot.js"></script>
</body>
</html>
